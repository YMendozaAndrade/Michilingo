<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Instituto de Idiomas</title>
  <link rel="shortcut icon" type="image/jpeg" href="img/Diseño Final.jpeg">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-body">
  <div class="login-caja">
    <div class="login-logo">
      <img src="img/Diseño Final.jpeg" alt="MichiLingo" class="login-imagen">
      <h1 class="login-titulo">MichiLingo</h1>
      <p class="login-subtitulo">Instituto de Idiomas</p>
    </div>
    <form id="formLogin" autocomplete="off">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required>
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <div class="campo-contrasena">
          <input type="password" id="contrasena" required>
          <button type="button" id="toggleContrasena" class="btn-ojito" aria-label="Mostrar u ocultar contraseña">
            <svg class="ojito-abierto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojito-cerrado hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <p id="mensajeError" class="error hidden"></p>
      <button type="submit" class="btn btn-primario btn-full">Entrar</button>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
